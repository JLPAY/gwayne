[App]
Name = gwayne
HttpPort = 8080
RunMode = debug
RsaPrivateKey = "./conf/rsa-private.pem"
RsaPublicKey = "./conf/rsa-public.pem"
TokenLifeTime = 86400
AppKey = "860af247a91adfad2q3tfc5797921c6"

[DataBase]
Driver = mysql
DBName = gwayne
Host = *.*.*.*
Port = 3306
DBUser = root
DBPassword = ********
DBConnTTL = 3600
ShowSql = true
LogMode = false

[Log]
LogLevel = debug
LogPath = ./logs/

# OAuth2 多 provider 子配置段格式，每个 provider 一个子段
# 回调地址格式: <RedirectURL>/login/oauth2/<name>
[Auth.Oauth2.Opsmanage]
Enabled = false
HideOnUI = false
Name = opsmanage
RedirectURL = "http://127.0.0.1:8080"
ClientId = <从 opsmanage 管理员获取>
ClientSecret = <从 opsmanage 管理员获取>
AuthURL = https://opsgate.jlpay.com/tops/api/v1/oauth2/authorize/
TokenURL = https://opsgate.jlpay.com/tops/api/v1/oauth2/token/
ApiURL = https://opsgate.jlpay.com/tops/api/v1/oauth2/userinfo/
ApiMapping = name:username,email:email,display:display_name

[Auth.Oauth2.Wecom]
Enabled = false
HideOnUI = true
Name = wecom
RedirectURL = "http://127.0.0.1:8080"
ClientId = <wecom client_id>
ClientSecret = <wecom client_secret>
AuthURL = https://open.weixin.qq.com/connect/oauth2/authorize
TokenURL = https://api.weixin.qq.com/sns/oauth2/access_token
ApiURL = https://api.weixin.qq.com/sns/userinfo
ApiMapping = name:name,email:email,display:nickname

# 以下为旧的单 provider 格式，已不再支持，请改用上面的子配置段格式
